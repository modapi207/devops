name: Build and Push Image

on:
  push:
    branches: [main]
    paths:                       
      - 'guestbook/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]             
  workflow_dispatch:         

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/guestbook

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: guestbook      
    steps:
      - name: 소스 코드 가져오기
        uses: actions/checkout@v7
      - name: Python 준비
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 코드 검사(Lint)
        run: |
          pip install ruff
          ruff check . --select=E9,F
      - name: 앱 동작 테스트
        env:
          REDIS_HOST: ''
        run: |
          python-m pip install -r requirements.txt
          python-m unittest discover -s tests -v
